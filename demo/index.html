<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vector Tiles in the Browser</title>
  <style>
    :root { color-scheme: light dark; --bg: #faf8f3; --fg: #211a12; --muted: #6b6152; --line: #ddd5c4; --accent: #8a5a12; --code: #f1ece0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #17140f; --fg: #eee7da; --muted: #a89d8a; --line: #3a342a; --accent: #e0b25c; --code: #221d16; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    p.lede { color: var(--muted); margin: 0 0 20px; max-width: 70ch; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    select, button { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--code); color: var(--fg); }
    button { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    select { flex: 1; min-width: 0; }
    textarea { width: 100%; min-height: 200px; font: 13px/1.45 ui-monospace, monospace; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--code); color: var(--fg); resize: vertical; }
    #status { color: var(--muted); margin: 10px 0; min-height: 1.5em; }
    #out { overflow-x: auto; }
    table { border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    pre.error { white-space: pre-wrap; color: #c0392b; }
  </style>
</head>
<body>
<main>
  <h1>Vector tiles, queried in the browser</h1>
  <p class="lede">Haybarn WASM runs in this tab, and the mvt VGI worker runs beside it in a Web Worker
    (<code>ATTACH 'worker:mvt-worker.js'</code>). Tiles are read straight from the PMTiles files with HTTP
    range requests: there is no server in between.</p>
  <div class="bar">
    <select id="examples" aria-label="Example queries"></select>
    <button id="run" type="button">Run (⌘↵)</button>
  </div>
  <textarea id="sql" spellcheck="false" aria-label="SQL"></textarea>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="out"></div>
</main>
<script type="module" src="./demo.mjs"></script>
</body>
</html>
